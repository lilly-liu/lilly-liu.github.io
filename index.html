<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe5" />
    <meta
      name="description"
      content="Lilly Liu builds thoughtful, reliable products for people and teams."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%231f241f'/%3E%3Ctext x='20' y='26' text-anchor='middle' font-family='Georgia' font-size='18' fill='%23f4efe5'%3ELL%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles/minimal.css?v=3" />
    <script src="/js/minimal.js?v=3" defer></script>
    <title>Lilly Liu</title>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="name">Lilly Liu</p>
        <div class="introduction">
          <h1 class="typing-greeting" id="page-title">
            <span class="sr-only">Hi, I’m Lilly.</span>
            <span aria-hidden="true">
              Hi, I’m<br />
              <span class="typing-slot">
                <span class="typing-line"
                  ><span id="typing-name">Lilly</span
                  ><span class="typing-cursor">|</span></span
                >
              </span>
            </span>
          </h1>
          <p class="summary">
            I build thoughtful, reliable products for people and teams.
            <span class="current-role"
              >Currently building software at CMT (Cambridge Mobile
              Telematics).</span
            >
          </p>
          <div class="profile-actions">
            <a
              class="profile-link"
              href="https://www.linkedin.com/in/lillyyliu/"
              target="_blank"
              rel="noopener noreferrer"
            >
              LinkedIn <span aria-hidden="true">↗</span>
            </a>
            <button class="typing-toggle" type="button" hidden>
              Pause animation
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <span>© 2026 Lilly Liu</span>
    </footer>
  </body>
</html>
